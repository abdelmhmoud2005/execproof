[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execproof"
version = "0.2.0"
description = "Safe-by-design DAST + SAST CLI that proves OS command injection (RCE) with real execution evidence — arithmetic canaries, blind timing, OOB callbacks, SSTI escalation and id/whoami impact verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "abdelmhmoud2005" }]
keywords = ["rce", "command-injection", "dast", "sast", "ssti", "security-tools", "pentest", "bugbounty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "jinja2>=3.0"]

[project.scripts]
execproof = "execproof.cli:main"

[project.urls]
Homepage = "https://github.com/abdelmhmoud2005/execproof"
Issues = "https://github.com/abdelmhmoud2005/execproof/issues"

[tool.setuptools.packages.find]
include = ["execproof*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep the historical ruff default rule set so CI is stable across ruff releases.
select = ["E4", "E7", "E9", "F"]
